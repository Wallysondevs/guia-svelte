<!doctype html><meta charset="utf-8"><body><div id="alvo"></div>
<script type="module">
import { compile } from './svelte-compiler.js';
import { mount } from './svelte-motor.js';

const fonte = `<script>
  let contador = 0;
  let nome = 'Ana';
<\/script>

<h1>Olá, {nome}</h1>
<button onclick={() => contador++}>Cliques: {contador}</button>`;

const comp = compile(fonte, { generate: 'client', dev: false, filename: 'App.svelte' });
const motor = new URL('./svelte-motor.js', location.href).href;
let codigo = comp.js.code.replace(/(['"])svelte(\/[^'"]*)?\1/g, "'" + motor + "'");
window.__codigo = codigo;
const mod = await import(URL.createObjectURL(new Blob([codigo], { type: 'text/javascript' })));
mount(mod.default, { target: document.getElementById('alvo') });
window.__pronto = true;
</script>
