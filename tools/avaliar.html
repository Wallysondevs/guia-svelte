<p>Página interna do testador: compila e roda os componentes das caixas sem abrir as 144 páginas.</p>
<script src="../assets/sveltesim.js"></script>
<script>
  // o testador espera este sinal para saber que o avaliador está no ar
  window.__avaliadorPronto = false;

    if (typeof window.__svelteAvaliar === "function") { window.__avaliadorPronto = true; return; }
    setTimeout(esperar, 40);
  })();
